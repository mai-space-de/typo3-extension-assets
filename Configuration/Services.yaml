services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Maispace\MaiAssets\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Event/*'
            - '../Classes/EventListener/*'

    Maispace\MaiAssets\Hook\ContentElementSaveHook:
        public: true

    Maispace\MaiAssets\EventListener\AboveFoldObserverListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/above-fold-observer'
              event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent

    Maispace\MaiAssets\EventListener\SvgSpriteInjectionListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/svg-sprite-injection'
              event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent

    Maispace\MaiAssets\EventListener\HtmlMinificationListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/html-minification'
              event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent
              after: 'mai-assets/svg-sprite-injection'

    Maispace\MaiAssets\Collector\SvgSpriteCollector:
        shared: true

    Maispace\MaiAssets\Collector\FontPreloadCollector:
        shared: true

    Maispace\MaiAssets\Cache\AboveFoldCacheService:
        shared: true

    Maispace\MaiAssets\Cache\InvalidationService:
        shared: true

    Maispace\MaiAssets\EarlyHints\EarlyHintCandidateCollector:
        shared: true

    Maispace\MaiAssets\EarlyHints\EarlyHintCacheService:
        shared: true

    Maispace\MaiAssets\EventListener\EarlyHintManifestListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/early-hint-manifest'
              event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent
              after: 'mai-assets/svg-sprite-injection'

    Maispace\MaiAssets\EventListener\CriticalCacheInvalidationListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/critical-cache-invalidation'
              event: Maispace\MaiAssets\Event\AfterCriticalUidsUpdatedEvent

    Maispace\MaiAssets\EventListener\StaticFileCacheReadinessListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/static-file-cache-readiness'
              event: SFC\Staticfilecache\Event\CacheRuleEvent

    Maispace\MaiAssets\EventListener\CacheWarmupListener:
        tags:
            - name: event.listener
              identifier: 'mai-assets/cache-warmup'
              event: Maispace\MaiAssets\Event\AfterCriticalUidsUpdatedEvent
              after: 'mai-assets/critical-cache-invalidation'

    Maispace\MaiAssets\Command\WarmupCommand:
        tags:
            - name: console.command
              command: 'maispace:assets:warmup'

    Maispace\MaiAssets\Command\CheckCriticalCssRegressionCommand:
        tags:
            - name: console.command
              command: 'maispace:assets:check-critical-css-regression'
