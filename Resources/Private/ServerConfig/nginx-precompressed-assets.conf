# =============================================================================
# mai_assets — Nginx Pre-Compressed Static Asset Delivery
# =============================================================================
#
# Include this snippet in your nginx server block to enable pre-compressed
# Brotli and Gzip delivery of compiled assets (CSS, JS, SVG) generated by
# mai_assets' CompressionProcessor.
#
# For DDEV: place this file (or its contents) in .ddev/nginx_full/
# and remove the #ddev-generated marker, OR add it to a custom config in
# .ddev/nginx/ (included automatically via nginx-site.conf's
# "include /mnt/ddev_config/nginx/*.conf;").
#
# Ported from patterns in EXT:staticfilecache HtaccessGenerator and its
# Nginx documentation at Documentation/Configuration/Nginx.rst.
# =============================================================================


# ---------------------------------------------------------------------------
# 1. Pre-compressed static file serving
# ---------------------------------------------------------------------------
# gzip_static and brotli_static check for .gz / .br variants alongside the
# requested file and serve them transparently when the client's Accept-
# Encoding header matches. No rewrite rules needed.
#
# Requires ngx_brotli module for brotli_static:
#   https://github.com/google/ngx_brotli
# ---------------------------------------------------------------------------

# Enable for the compiled assets directory
location ~ ^/typo3temp/assets/mai_assets/compiled/ {
    gzip_static  on;
    brotli_static on;

    # Disable on-the-fly compression — pre-compressed files already exist
    gzip  off;
    brotli off;

    # Long cache lifetime (content-hash keyed → immutable)
    expires     1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;

    # Ensure correct MIME types for the hash-named files
    types {
        text/css                          css;
        application/javascript            js;
        image/svg+xml                     svg;
    }

    # Strip ETag for immutable assets (reduces If-None-Match checks)
    etag off;

    # Disable access log for static asset requests
    access_log off;

    # Security: only serve files with expected extensions
    location ~ \.css$  { }
    location ~ \.js$   { }
    location ~ \.svg$  { }
    location ~ \.gz$   { }
    location ~ \.br$   { }
    location /         { deny all; }
}


# ---------------------------------------------------------------------------
# 2. TYPO3 _assets/ directory (versioned extension assets)
# ---------------------------------------------------------------------------
# Contains symlinks to extension Resources/Public directories.
# Also content-hash versioned, so immutable caching applies.
# ---------------------------------------------------------------------------
location ~ ^/_assets/ {
    gzip_static  on;
    brotli_static on;
    gzip  off;
    brotli off;

    expires     1y;
    add_header Cache-Control "public, immutable";
    add_header Vary Accept-Encoding;
    etag off;

    access_log off;

    # Security: only serve files with expected extensions
    location ~ \.(css|js|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ { }
    location ~ \.gz$   { }
    location ~ \.br$   { }
    location /         { deny all; }
}


# ---------------------------------------------------------------------------
# 3. Global Vary header
# ---------------------------------------------------------------------------
# Ensure upstream caches and CDNs vary by Accept-Encoding.
# Add this to your main server block, not a nested location.
# ---------------------------------------------------------------------------
# map $upstream_http_content_type $vary_header {
#     default "";
#     "~text/css|application/javascript|image/" "Accept-Encoding";
# }
# add_header Vary $vary_header;


# ---------------------------------------------------------------------------
# 4. Alternative: Global pre-compression via gzip_static (simpler, site-wide)
# ---------------------------------------------------------------------------
# If you prefer a simpler approach, enable these directives at the http or
# server level instead of per-location configuration above:
#
# gzip_static  on;
# brotli_static on;
# gzip_types   text/css application/javascript image/svg+xml;
# brotli_types text/css application/javascript image/svg+xml;
