# =============================================================================
# mai_assets — Apache Pre-Compressed Static Asset Delivery
# =============================================================================
#
# Place this snippet in your DocumentRoot .htaccess (public/.htaccess) or
# preferably in your Apache VirtualHost configuration for better performance.
#
# It serves pre-compressed Brotli (.br) and Gzip (.gz) variants of compiled
# assets (CSS, JS, SVG) when the client's Accept-Encoding header indicates
# support. The variants are generated by mai_assets' CompressionProcessor
# after compilation (see Classes/Processing/CompressionProcessor.php).
#
# Requirements:
#   - mod_rewrite
#   - mod_headers
#   - mod_mime (for correct Content-Type on compressed variants)
#   - mod_expires (for long-lived cache headers, optional)
#
# Ported from patterns in EXT:staticfilecache HtaccessGenerator.
# =============================================================================


# ---------------------------------------------------------------------------
# 1. Pre-compressed content negotiation
# ---------------------------------------------------------------------------
# Priority: Brotli > Gzip > uncompressed.
# Only rewrite when the compressed variant exists on disk.
# ---------------------------------------------------------------------------
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Brotli — highest priority
    RewriteCond %{HTTP:Accept-Encoding} br
    RewriteCond %{REQUEST_FILENAME}.br -f
    RewriteRule ^(.*\.(css|js|svg))$ $1.br [L]

    # Gzip — fallback when Brotli is not supported
    RewriteCond %{HTTP:Accept-Encoding} gzip
    RewriteCond %{REQUEST_FILENAME}.gz -f
    RewriteRule ^(.*\.(css|js|svg))$ $1.gz [L]
</IfModule>


# ---------------------------------------------------------------------------
# 2. Correct Content-Encoding + Content-Type for compressed variants
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|svg)\.gz$">
        Header set Content-Encoding gzip
        Header append Vary Accept-Encoding
    </FilesMatch>
    <FilesMatch "\.(css|js|svg)\.br$">
        Header set Content-Encoding br
        Header append Vary Accept-Encoding
    </FilesMatch>
</IfModule>

<IfModule mod_mime.c>
    <FilesMatch "\.css\.(gz|br)$">
        AddType text/css .css.gz .css.br
    </FilesMatch>
    <FilesMatch "\.js\.(gz|br)$">
        AddType application/javascript .js.gz .js.br
    </FilesMatch>
    <FilesMatch "\.svg\.(gz|br)$">
        AddType image/svg+xml .svg.gz .svg.br
    </FilesMatch>
</IfModule>


# ---------------------------------------------------------------------------
# 3. Long-lived cache headers for compiled assets
# ---------------------------------------------------------------------------
# Compiled assets use content-hash-based filenames (see Documentation/Architecture/).
# Once deployed, the filename never changes unless the source content changes,
# so a 1-year cache with "immutable" is safe and optimal.
#
# The hash-based path is: typo3temp/assets/mai_assets/compiled/<md5>.css
# (and its .gz / .br counterparts).
# ---------------------------------------------------------------------------
<IfModule mod_expires.c>
    ExpiresActive On

    # 1 year for hash-keyed compiled assets
    <LocationMatch "^/typo3temp/assets/mai_assets/compiled/">
        ExpiresByType text/css                          "access plus 1 year"
        ExpiresByType application/javascript            "access plus 1 year"
        ExpiresByType image/svg+xml                     "access plus 1 year"
    </LocationMatch>
</IfModule>

<IfModule mod_headers.c>
    <LocationMatch "^/typo3temp/assets/mai_assets/compiled/">
        Header set Cache-Control "public, immutable, max-age=31536000"
        Header unset ETag
        Header unset Last-Modified
    </LocationMatch>
</IfModule>
FileETag None


# ---------------------------------------------------------------------------
# 4. TYPO3 _assets/ directory (versioned extension assets)
# ---------------------------------------------------------------------------
# The public/_assets/ directory contains symlinks to extension Resources/Public
# folders and is also content-hash versioned. Apply similar caching.
# ---------------------------------------------------------------------------
<IfModule mod_expires.c>
    <LocationMatch "^/_assets/">
        ExpiresByType text/css                          "access plus 1 year"
        ExpiresByType application/javascript            "access plus 1 year"
        ExpiresByType image/svg+xml                     "access plus 1 month"
        ExpiresByType image/png                         "access plus 1 month"
        ExpiresByType image/jpeg                        "access plus 1 month"
        ExpiresByType image/gif                         "access plus 1 month"
        ExpiresByType image/webp                        "access plus 1 month"
        ExpiresByType image/avif                        "access plus 1 month"
    </LocationMatch>
</IfModule>

<IfModule mod_headers.c>
    <LocationMatch "^/_assets/">
        Header set Cache-Control "public, immutable, max-age=31536000"
        Header unset ETag
    </LocationMatch>
</IfModule>


# ---------------------------------------------------------------------------
# 5. Vary header for the entire site
# ---------------------------------------------------------------------------
# Ensure proxies and CDNs know that content encoding varies by client.
# ---------------------------------------------------------------------------
<IfModule mod_headers.c>
    Header append Vary Accept-Encoding
</IfModule>
